<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pink Pixels | Months</title>

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Serif+Display:wght@400;600;700&family=Tangerine:wght@700&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="subject.css">
    <style>
        .star{

    width:140px;
    height:140px;

    background:var(--card);

    clip-path:polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 91%,
        50% 70%,
        21% 91%,
        32% 57%,
        2% 35%,
        39% 35%
    );

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:18px;

    box-shadow:6px 6px rgba(0,0,0,.08);

}
    </style>

</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        Pink Pixels
    </a>

    <div class="subject-heading">

        <h1 id="subjectTitle">
            Subject
        </h1>

    </div>

</header>

<main class="months-page">

    <h2 class="page-title">
        Choose a Month
    </h2>

    <div class="months-grid">

        <div class="month-card" data-month="June">
            <div class="star">
                <span>Month 1</span>
            </div>
        </div>

        <div class="month-card" data-month="July">
            <div class="star">
                <span>Month 2</span>
            </div>
        </div>

        <div class="month-card" data-month="August">
            <div class="star">
                <span>Month 3</span>
            </div>
        </div>

        <div class="month-card" data-month="September">
            <div class="star">
                <span>Month 4</span>
            </div>
        </div>

        <div class="month-card" data-month="October">
            <div class="star">
                <span>Month 5</span>
            </div>
        </div>
        <div class="month-card" data-month="november">
            <div class="star">
                <span>Month 6</span>
            </div>
        </div>

      
    </div>

    <button class="back-btn" onclick="history.back()">
        ← Back
    </button>

</main>

<script src="subjects.js"></script>

</body>

</html>
